[package]
name = "bitcoin-indexer"
version = "0.1.5"
edition = "2021"
description = "Bitcoin indexer"
keywords = ["bitcoin", "indexer"]
repository = "https://github.com/fairgateLabs/rust-bitcoin-indexer"
readme = "README.md"


[dependencies]
bitcoin = "0.32.2"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "2.0.12"
anyhow = "1.0.86"
mockall = "0.13.0"
url = "2.5.2"
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
rust-bitvmx-storage-backend = { path = "../rust-bitvmx-storage-backend" }
bitvmx-settings = { path = "../rust-bitvmx-settings" }
bitvmx-bitcoin-rpc = { path = "../rust-bitvmx-bitcoin-rpc" }
bitcoind = { path = "../rust-bitcoind" }
