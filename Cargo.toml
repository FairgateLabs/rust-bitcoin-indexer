[package]
name = "bitcoin-indexer"
version = "0.8.5"
edition = "2021"
description = "Bitcoin indexer"
keywords = ["bitcoin", "indexer"]
repository = "https://github.com/fairgateLabs/rust-bitcoin-indexer"
readme = "README.md"


[dependencies]
bitcoin = "0.32.102"
tracing = "0.1.44"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.5" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.5" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.5" }

[dev-dependencies]
anyhow = "1.0.104"
serde_json = "1.0"
tracing-subscriber = "0.3.23"
bitcoincore-rpc = "0.19"
bitcoind = { git = "https://github.com/FairgateLabs/rust-bitcoind.git", tag = "v0.8.5" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.5", features = [
    "testing",
] }
